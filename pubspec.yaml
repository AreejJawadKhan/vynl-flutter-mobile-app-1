name: music_player
description: AI-powered music player with social listening and voice search.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio playback
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  audio_session: ^0.1.18
  on_audio_query: ^2.9.0

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.2.2

  # Permissions
  permission_handler: ^11.1.0

  # Voice search
  speech_to_text: ^7.0.0

  # Fonts
  google_fonts: ^6.2.1

  # UI utilities
  cached_network_image: ^3.3.1
  flutter_slidable: ^3.0.1

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
