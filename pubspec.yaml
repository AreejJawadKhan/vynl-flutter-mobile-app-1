name: music_player
description: AI-powered music player with social listening and voice search.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Audio playback
  just_audio: ^0.9.36
  just_audio_background: ^0.0.1-beta.11
  audio_session: ^0.1.18
  on_audio_query: ^2.9.0

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.2.2

  # Permissions
  permission_handler: ^11.1.0

  # Voice search
  speech_to_text: ^7.0.0

  # Fonts
  google_fonts: ^6.2.1

  # UI utilities
  cached_network_image: ^3.3.1
  flutter_slidable: ^3.0.1

  cupertino_icons: ^1.0.2
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_database: ^12.4.1
  google_sign_in: ^7.2.0
  firebase_analytics: ^12.4.1
  flutter_dotenv: ^6.0.1

  # Networking
  http: ^1.2.1
  dio: ^5.4.3+1

  # UI extras
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  lottie: ^3.1.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#7D0531"  # darkBerry color
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
    - assets/icons/app_icon.png
    - assets/icons/app_icon_foreground.png
    - assets/icons/
